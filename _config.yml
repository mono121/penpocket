title: 筆記具コレクション
description: 万年筆・ボールペン・ペンシルを中心とした筆記具の収集記録
lang: ja

# GitHub Pages で公開する場合はリポジトリ名に合わせる
# 公開先: https://mono121.github.io/penpocket/
baseurl: "/penpocket"
# jekyll-sitemap は url + baseurl で <loc> を組む。空だと相対URLになり
# サイトマップ仕様（絶対URL必須）を満たさなくなる。
url: "https://mono121.github.io"

collections:
  pens:
    output: true
    permalink: /pens/:name/

defaults:
  - scope:
      path: ""
      type: pens
    values:
      layout: pen

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  # ローカル確認用のスクリプト。サイトの構成物ではない。
  - build_preview.py
  - build_variants.py
